name: Flowzone

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  id-token: write  # https://docs.npmjs.com/trusted-publishers
  contents: read
  packages: read  # should we decide to publish to ghcr.io

jobs:
  flowzone:
    name: Flowzone
    uses: product-os/flowzone/.github/workflows/flowzone.yml@master # flowzonify 0.4.23

    # Workflows in the same org or enterprise can use the inherit keyword to implicitly pass secrets
    secrets: inherit
